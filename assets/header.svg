<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-labelledby="title desc">
  <title id="title">brizzy.spec.ts</title>
  <desc id="desc">A terminal running a Playwright test file about Brizzy. Four tests pass: is a QA automation engineer, breaks things on purpose then writes down how, builds bots for chores nobody wants, currently learning APIs from the inside out.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .txt  { fill: #c9d1d9; }
    .dim  { fill: #6e7681; }
    .ok   { fill: #3fb950; }
    .me   { fill: #e3b341; }
    .line { opacity: 0; animation: in .01s linear forwards; }
    .l1 { animation-delay: .3s; }
    .l2 { animation-delay: 1.1s; }
    .l3 { animation-delay: 1.6s; }
    .l4 { animation-delay: 2.0s; }
    .l5 { animation-delay: 2.4s; }
    .l6 { animation-delay: 2.8s; }
    .l7 { animation-delay: 3.4s; }
    .cursor { animation: blink 1.1s steps(1) infinite; animation-delay: 3.4s; }
    @keyframes in { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1; }
      .cursor { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="818" height="298" rx="10" fill="#111418" stroke="#30363d"/>
  <circle cx="24" cy="22" r="5" fill="#3a3f47"/>
  <circle cx="42" cy="22" r="5" fill="#3a3f47"/>
  <circle cx="60" cy="22" r="5" fill="#3a3f47"/>
  <text x="410" y="27" text-anchor="middle" class="mono dim" font-size="12">~/brizzy</text>
  <line x1="1" y1="42" x2="819" y2="42" stroke="#30363d"/>

  <g class="mono">
    <text x="28" y="78"><tspan class="dim">$ </tspan><tspan class="txt">npx playwright test </tspan><tspan class="me">brizzy.spec.ts</tspan></text>

    <text x="28" y="110" class="line l1 dim">Running 4 tests using 1 worker</text>

    <text x="44" y="142" class="line l2"><tspan class="ok">✓ </tspan><tspan class="txt">is a QA automation engineer</tspan></text>
    <text x="44" y="166" class="line l3"><tspan class="ok">✓ </tspan><tspan class="txt">breaks things on purpose, then writes down how</tspan></text>
    <text x="44" y="190" class="line l4"><tspan class="ok">✓ </tspan><tspan class="txt">builds bots for the chores nobody wants</tspan></text>
    <text x="44" y="214" class="line l5"><tspan class="ok">✓ </tspan><tspan class="txt">learning APIs from the inside, not just poking them</tspan></text>

    <text x="28" y="252" class="line l6"><tspan class="ok">4 passed</tspan><tspan class="dim"> (brizzy)</tspan></text>
    <g class="line l7">
      <text x="28" y="280"><tspan class="dim">$ </tspan></text>
      <rect class="cursor" x="44" y="268" width="9" height="16" fill="#c9d1d9"/>
    </g>
  </g>
</svg>
