<svg xmlns="http://www.w3.org/2000/svg" width="820" height="64" viewBox="0 0 820 64" role="img" aria-labelledby="title">
  <title id="title">Process exited with code 0. See you in the next run.</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect x="1" y="1" width="818" height="62" rx="10" fill="#111418" stroke="#30363d"/>
  <text x="28" y="37" class="mono">
    <tspan fill="#6e7681">process exited with code </tspan><tspan fill="#3fb950">0</tspan><tspan fill="#6e7681">  ·  see you in the next run</tspan>
  </text>
  <rect class="cursor" x="466" y="25" width="8" height="15" fill="#c9d1d9"/>
</svg>
